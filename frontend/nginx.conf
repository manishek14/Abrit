# ============================================================================
# AbrIT panel — nginx serves the SPA and reverse-proxies backend + WebSocket.
# The frontend and the API share ONE origin in production: cookies become
# first-party (no CORS), SameSite=Strict holds, and the WebSocket upgrade is
# handled natively below.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- hardening -----------------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The admin panel sends small JSON payloads only.
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- reverse proxy: REST API --------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- reverse proxy: WebSocket (socket.io) -------------------------------
    # WebSocket from the panel MUST pass the reverse proxy (review round 6):
    # the Upgrade/Connection headers below are what make that work.
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # socket.io heartbeats every 25 s; 1 h read timeout survives idle tabs
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # --- container healthcheck (no proxying, no DB) --------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # --- hashed assets: immutable -------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
